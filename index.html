<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Tienda Minorista</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            /* Fondo negro puro con un brillo radial sutil al centro para dar profundidad */
            background: radial-gradient(circle at center, #121212 0%, #050505 75%);
            color: #d0d0d0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Tarjeta de login principal */
        .login-card {
            background-color: #0d0d0d;
            border: 1px solid #1f1f1f;
            padding: 40px 38px 34px 38px;
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 40px rgba(255, 255, 255, 0.01);
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(25px);
            animation: fadeInSlide 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSlide {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cabecera con isotipo geométrico */
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: #161616;
            border: 1px solid #262626;
            border-radius: 12px;
            margin: 0 auto 14px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
            fill: #e0e0e0;
        }

        .login-header h2 {
            font-size: 20px;
            color: #f0f0f0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #777777;
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* Contenedor para alinear los inputs con sus iconos */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            fill: #555555;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 13px 16px 13px 44px; /* Espacio extra a la izquierda para el icono */
            background-color: #121212;
            border: 1px solid #202020;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #555555;
            background-color: #161616;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.03);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #e0e0e0 0%, #a6a6a6 100%);
            color: #050505;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.04);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.08);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Pie de página discreto para anclar la interfaz */
        .page-footer {
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: #444444;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <!-- Isotipo minimalista superior -->
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/></svg>
        </div>
        <h2>Tienda Minorista</h2>
    </div>

    <form action="login.php" method="POST">
        <div class="form-group">
            <label for="usuario">Usuario</label>
            <div class="input-wrapper">
                <!-- Icono de usuario -->
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <!-- Icono de candado -->
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">Ingresar</button>
    </form>
</div>

<!-- Footer sutil para llenar el espacio vertical -->
<div class="page-footer">Sistema de Gestión v1.0 • UNACH</div>

</body>
</html>
